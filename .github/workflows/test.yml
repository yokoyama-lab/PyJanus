name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run test suite with coverage
        # g++ is preinstalled on ubuntu-latest, so the codegen differential
        # (tests/jana2014/test_codegen_corpus.py) runs here too.
        run: python -m pytest tests/ -q --cov=jana_py --cov-branch --cov-report=term-missing
