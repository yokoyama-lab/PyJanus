name: coq

# Build the Rocq development and assert it is axiom-clean on every push/PR.
# (The Python interpreter has its own workflow in test.yml.)
on:
  push:
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml + opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install Rocq
        run: opam install -y rocq-prover

      - name: Build coq/ and audit axioms
        # audit.sh: `rocq makefile` + `make`, then Print Assumptions on every
        # headline theorem; fails on any axiom beyond functional_extensionality,
        # or any Admitted.
        run: |
          eval "$(opam env)"
          bash coq/audit.sh

      - name: Every extracted interpreter must agree with PyJanus
        # Four independent interpreters are extracted from the Rocq development
        # (three evaluation cores plus the standalone vjanus with its own OCaml
        # parser); each must produce PyJanus's final store on every test program.
        # tests/conftest.py builds whatever a test needs, so this is just pytest;
        # build.sh is still run first because it also executes frame_smoke.
        run: |
          eval "$(opam env)"
          bash coq/vjanus/build.sh
          python3 -m pip install -e ".[dev]"
          python3 -m pytest -q \
            tests/jana2014/test_verified_corpus.py \
            tests/jana2014/test_verified_cores_corpus.py \
            tests/jana2014/test_vjanus_corpus.py \
            tests/jana2014/test_vjanus_errors.py \
            tests/jana2014/test_vjanus_inverse.py \
            tests/jana2014/test_vjanus_features.py
